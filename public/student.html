<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem('lcb_theme');
if(!t)t='light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="/assets/img/logo.png">
<title>Join Live Class — LiveClass Board</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/student.css">
</head>
<body>

<!-- ---------------------------- JOIN SCREEN ---------------------------- -->
<div class="join-screen" id="joinScreen">
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="position:absolute;top:20px;right:20px;">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="join-card card">
    <img src="/assets/img/logo.png" class="brand-mark" style="margin:0 auto 14px;" alt="LiveClass Board">
    <h1>Join Live Class</h1>
    <p class="muted" id="classPreview">Loading class…</p>

    <div id="joinError"></div>

    <form id="joinForm">
      <div class="field">
        <label for="studentName">Your Name</label>
        <input type="text" id="studentName" required maxlength="40" placeholder="e.g. Rahul">
      </div>
      <div class="field">
        <label for="classCode">Class Code</label>
        <input type="text" id="classCode" required maxlength="6" style="text-transform:uppercase;letter-spacing:.15em;text-align:center;font-weight:700;">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="joinBtn">Join Class</button>
    </form>
  </div>
</div>

<!-- ---------------------------- LIVE VIEWER ---------------------------- -->
<div class="viewer hidden" id="viewer">
  <header class="viewer-top">
    <div class="viewer-subject">
      <b id="vSubject">Subject</b>
      <span id="vClass" class="muted"></span>
    </div>
    <div class="viewer-status">
      <span id="vConn" class="pill pill-live"><span class="dot"></span>LIVE</span>
      <span id="vCount" class="muted">0 students</span>
      <button type="button" class="btn-icon btn-ghost" id="fullscreenBtn" title="Fullscreen" style="width:32px;height:32px;">⛶</button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="width:32px;height:32px;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="viewer-tabs">
    <span class="viewer-tab-label" id="vModeLabel">💻 Code</span>
  </div>

  <div class="viewer-stage" id="viewerStage">
    <div class="stage-zoomable" id="stageZoomable">

      <div class="code-view-wrap hidden" id="codeViewWrap">
        <div class="code-gutter" id="codeGutter">1</div>
        <div class="code-cursor-line" id="codeCursorLine" hidden></div>
        <pre class="code-view" id="codeView"><code id="codeViewInner"></code></pre>
      </div>

      <div class="notes-view hidden" id="notesView"></div>

      <canvas class="wb-view hidden" id="wbView" width="1600" height="900"></canvas>

    </div>
  </div>

  <div class="preview-panel-student hidden" id="studentPreviewPanel">
    <div class="preview-panel-head"><span>Live Preview</span></div>
    <iframe id="studentPreviewFrame" title="Live preview" sandbox="allow-scripts"></iframe>
  </div>

  <button type="button" class="hand-raise-btn" id="handRaiseBtn" title="Raise hand">✋</button>
  <div class="key-overlay" id="keyOverlay"></div>

  <div class="viewer-banner hidden" id="pausedBanner">⏸ The teacher has paused the class.</div>

  <div class="zoom-controls">
    <button class="btn-icon btn-ghost" id="zoomOut" title="Zoom out">−</button>
    <span id="zoomLevel">100%</span>
    <button class="btn-icon btn-ghost" id="zoomIn" title="Zoom in">+</button>
    <button class="btn btn-ghost btn-sm" id="zoomFit">Fit to Screen</button>
    <button class="btn btn-ghost btn-sm" id="zoomReset">Reset</button>
  </div>
</div>

<div class="end-screen hidden" id="endScreen">
  <div class="card end-card">
    <h2 id="endTitle">Class has ended</h2>
    <p class="muted" id="endMessage">Thanks for joining! Ask your teacher for the notes if they shared any.</p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs.min.css">
<script src="/js/theme.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
